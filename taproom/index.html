<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linden Street Brewhouse • Live Taproom & Cellar</title>
  <style>
    :root {
      --bg: #12100e;
      --bg-card: #1a1613;
      --border: #362d26;
      --text: #f5f0e6;
      --muted: #a89e93;
      --accent: #d9822b;
      --accent-strong: #c06f1d;
      --success-bg: #052e2b;
      --success-text: #a7f3d0;
      --danger-text: #fbbf24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(16,185,129,0.4);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .subhead {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--accent);
      color: #12100e;
      font-weight: 800;
      font-size: 12px;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      transition: background 0.2s ease;
    }

    .cta:hover {
      background: var(--accent-strong);
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 28px;
    }

    .beer-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 32px rgba(0,0,0,0.12);
    }

    .beer-card.highlight {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(217,130,43,0.35), 0 10px 32px rgba(0,0,0,0.15);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .tap-pill {
      display: inline-block;
      background: var(--accent);
      color: #12100e;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stats {
      color: var(--muted);
      font-size: 12px;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .beer-name {
      margin: 0;
      font-size: clamp(1.4rem, 2vw, 2rem);
      line-height: 1.2;
    }

    .beer-subtitle {
      margin: 6px 0 0;
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
    }

    .beer-description {
      margin: 14px 0 0;
      color: #cfc6b9;
      font-size: 14px;
      line-height: 1.6;
    }

    .details {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #2a231e;
      font-size: 12px;
      color: var(--muted);
    }

    .details div + div {
      margin-top: 8px;
    }

    .allergen {
      color: var(--danger-text);
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 32px 20px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.02);
    }

    @media (max-width: 640px) {
      .topbar {
        align-items: flex-start;
      }

      .cta {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div>
        <div class="status-badge">
          <span class="status-dot"></span>
          Live Synced with Google Sheets
        </div>
        <h1>LINDEN STREET BREWHOUSE</h1>
        <p class="subhead">Oakland, CA • Small-Batch Partigyle, Estate Wet Hops &amp; Vintage Cellar</p>
      </div>
      <a href="https://buymeacoffee.com" target="_blank" rel="noreferrer" class="cta">☕ Pitch In for Hops &amp; Malt</a>
    </header>

    <main id="grid" aria-live="polite"></main>
  </div>

  <script>
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxsFKPAfFs7xNhw8wubgPpFMGC3x4EiXcV0iCiURcNRoAImZrkme1CBwD-5vCwlklD7/exec";

    function asString(value, fallback = '') {
      if (typeof value === 'string') return value;
      if (typeof value === 'number') return String(value);
      return fallback;
    }

    function asNumber(value, fallback = 0) {
      const num = Number(value);
      return Number.isFinite(num) ? num : fallback;
    }

    function normalizeBeer(raw) {
      return {
        id: asString(raw && raw.id, ''),
        slug: asString(raw && raw.slug, ''),
        name: asString(raw && raw.name, 'Untitled Beer'),
        subtitle: asString(raw && raw.subtitle, ''),
        status: asString(raw && raw.status, 'On Tap'),
        tapSlot: asString(raw && raw.tapSlot, ''),
        abv: asNumber(raw && raw.abv, 0),
        ibu: asNumber(raw && raw.ibu, 0),
        srm: asNumber(raw && raw.srm, 0),
        description: asString(raw && raw.description, ''),
        commercialIngredients: asString(raw && raw.commercialIngredients, ''),
        allergenWarning: asString(raw && raw.allergenWarning, '')
      };
    }

    function createBeerCard(beer, highlight) {
      const article = document.createElement('article');
      article.className = 'beer-card' + (highlight ? ' highlight' : '');

      const meta = document.createElement('div');
      meta.className = 'meta-row';

      const tap = document.createElement('span');
      tap.className = 'tap-pill';
      tap.textContent = beer.tapSlot || beer.status;

      const stats = document.createElement('span');
      stats.className = 'stats';
      stats.textContent = `${beer.abv}% ABV • ${beer.ibu} IBU • ${beer.srm} SRM`;

      meta.appendChild(tap);
      meta.appendChild(stats);

      const name = document.createElement('h2');
      name.className = 'beer-name';
      name.textContent = beer.name;

      const subtitle = document.createElement('p');
      subtitle.className = 'beer-subtitle';
      subtitle.textContent = beer.subtitle;

      const description = document.createElement('p');
      description.className = 'beer-description';
      description.textContent = beer.description;

      const details = document.createElement('div');
      details.className = 'details';

      const ingredients = document.createElement('div');
      ingredients.innerHTML = '<strong style="color: var(--text);">Ingredients:</strong> ' + (beer.commercialIngredients || 'Not listed');

      const allergen = document.createElement('div');
      allergen.className = 'allergen';
      allergen.textContent = beer.allergenWarning || 'Allergen info not listed';

      details.appendChild(ingredients);
      details.appendChild(allergen);

      article.appendChild(meta);
      article.appendChild(name);
      if (beer.subtitle) article.appendChild(subtitle);
      article.appendChild(description);
      article.appendChild(details);

      return article;
    }

    function renderBeers(list) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const params = new URLSearchParams(window.location.search);
      const highlightSlug = params.get('beer');

      if (!Array.isArray(list) || !list.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No beers available right now. Check back soon.';
        grid.appendChild(empty);
        return;
      }

      const normalized = list
        .map(normalizeBeer)
        .filter((beer) => beer.name && beer.name !== 'Untitled Beer');

      normalized.forEach((beer) => {
        const isHighlighted = highlightSlug && beer.slug === highlightSlug;
        grid.appendChild(createBeerCard(beer, isHighlighted));
      });
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) {
        throw new Error('Failed to fetch ' + url);
      }
      return response.json();
    }

    async function loadBeers() {
      try {
        const localData = await fetchJson('./data/beers.json');
        if (Array.isArray(localData) && localData.length) {
          renderBeers(localData);
          return;
        }
      } catch (error) {
        console.warn('Local tap list unavailable:', error);
      }

      try {
        const remoteData = await fetchJson(WEBHOOK_URL);
        const remoteBeers = Array.isArray(remoteData) ? remoteData : (remoteData && Array.isArray(remoteData.beers) ? remoteData.beers : []);
        renderBeers(remoteBeers);
      } catch (error) {
        console.error('Unable to load beer data:', error);
        renderBeers([]);
      }
    }

    loadBeers();
  </script>
</body>
</html>
