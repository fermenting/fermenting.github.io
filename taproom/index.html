<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fermenting Life | Brewhouse & Taproom</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Load Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#12100E] text-[#F5F0E6] antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const XIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );
        const QrCodeIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        );
        const PrinterIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        );

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsFKPAfFs7xNhw8wubgPpFMGC3x4EiXcV0iCiURcNRoAImZrkme1CBwD-5vCwlklD7/exec';

        const srmToHex = (srm) => {
          const val = parseFloat(srm) || 12;
          if (val < 2) return '#F3F993';
          if (val < 6) return '#F5D700';
          if (val < 10) return '#D57100';
          if (val < 15) return '#9F3E00';
          if (val < 20) return '#6F1C00';
          if (val < 30) return '#360800';
          return '#1A0000';
        };

        const AFLogo = () => (
          <svg viewBox="0 0 100 100" className="w-10 h-10 stroke-[#D9822B]" fill="none" strokeWidth="6" strokeLinecap="square">
            <line x1="50" y1="10" x2="50" y2="90" />
            <line x1="50" y1="45" x2="20" y2="75" />
            <line x1="50" y1="45" x2="80" y2="45" />
            <line x1="35" y1="60" x2="65" y2="60" />
          </svg>
        );

        const BeerGlassIcon = ({ type, color }) => {
          const hex = srmToHex(color);
          const t = (type || '').toLowerCase();
          
          if (t.includes('chalice') || t.includes('globe')) {
            return (
              <svg viewBox="0 0 24 24" className="w-12 h-12" fill="none" stroke="currentColor" strokeWidth="1.5">
                <path d="M4 8c0 5 3.5 9 8 9s8-4 8-9M12 17v5M9 22h6" stroke="#4A3F35" />
                <path d="M5 8c0 4 3 7 7 7s7-3 7-7H5z" fill={hex} />
              </svg>
            );
          }
          
          if (t.includes('nonic') || t.includes('english')) {
            return (
              <svg viewBox="0 0 24 24" className="w-12 h-12" fill="none" stroke="currentColor" strokeWidth="1.5">
                <path d="M7 2l-1 6c-.5 1-.5 2-1 3.5s.5 2.5 1 3.5l1.5 7h8l1.5-7c.5-1 .5-2 1-3.5s-.5-2.5-1-3.5l-1-6H7z" stroke="#4A3F35" />
                <path d="M6.5 5l-.5 3c-.5 1-.5 2-1 3.5s.5 2.5 1 3.5l1.5 6h8l1.5-6c.5-1 .5-2 1-3.5s-.5-2.5-1-3.5l-.5-3H6.5z" fill={hex} />
              </svg>
            );
          }

          return (
            <svg viewBox="0 0 24 24" className="w-12 h-12" fill="none" stroke="currentColor" strokeWidth="1.5">
              <path d="M6 2l1.5 20h9L18 2H6z" stroke="#4A3F35" />
              <path d="M6.5 6l1.2 15h8.6l1.2-15H6.5z" fill={hex} />
            </svg>
          );
        };

        function App() {
          const [activeTab, setActiveTab] = useState('taproom');
          const [inventory, setInventory] = useState([]);
          const [loading, setLoading] = useState(true);
          const [selectedBeer, setSelectedBeer] = useState(null);
          const [activeModalImage, setActiveModalImage] = useState(0);

          useEffect(() => {
            fetch(SCRIPT_URL)
              .then(res => res.json())
              .then(data => {
                let rawList = [];
                if (Array.isArray(data)) {
                  rawList = data;
                } else if (data && Array.isArray(data.beers)) {
                  rawList = data.beers;
                }

                if (rawList.length > 0) {
                  const formatted = rawList.map(beer => {
                    // Support various column header naming conventions from Google Sheets
                    const photoAlbumUrl = beer.googlePhotosUrl || beer.google_photos_url || beer.photosUrl || beer.photos;
                    
                    let imgs = [];
                    if (beer.imagesString) {
                      imgs = beer.imagesString.split(',').map(s => s.trim()).filter(Boolean);
                    } else if (Array.isArray(beer.images)) {
                      imgs = beer.images;
                    }
                    if (imgs.length === 0) {
                      imgs = [`https://placehold.co/600x400/1A1613/D9822B?text=${encodeURIComponent(beer.name || 'Fermenting Life')}`];
                    }
                    return { ...beer, images: imgs, googlePhotosUrl: photoAlbumUrl };
                  });
                  setInventory(formatted);
                } else {
                  setInventory([
                    {
                      id: 'happy-hoppy',
                      name: 'Happy Hoppy Hopkins',
                      style: 'Funky Wet Hop Belgian IPA',
                      status: 'On Tap',
                      tap: 'Tap 1',
                      abv: '7.0%',
                      ibu: 33,
                      srm: 14.1,
                      glass: 'Chalice',
                      description: 'Brewed with homegrown wet hops from the Peralta Community Garden.',
                      Commercial_Ingredients_Disclosure: 'Water, Malted Barley, Whole-Cone Wet Hops, Yeast.',
                      Private_Grist: 'Extra Pale 2-Row (57.7%), Belgian Pilsner (26.4%)',
                      images: ['https://placehold.co/600x400/1A1613/D9822B?text=Happy+Hoppy+Hopkins']
                    }
                  ]);
                }
                setLoading(false);
              })
              .catch(err => {
                console.error("Failed to load inventory:", err);
                setInventory([
                  {
                    id: 'fallback-beer',
                    name: 'Happy Hoppy Hopkins',
                    style: 'Funky Wet Hop Belgian IPA',
                    status: 'On Tap',
                    tap: 'Tap 1',
                    abv: '7.0%',
                    ibu: 33,
                    srm: 14.1,
                    glass: 'Chalice',
                    description: 'Brewed with homegrown wet hops from the Peralta Community Garden.',
                    Commercial_Ingredients_Disclosure: 'Water, Malted Barley, Whole-Cone Wet Hops, Yeast.',
                    Private_Grist: 'Extra Pale 2-Row (57.7%), Belgian Pilsner (26.4%)',
                    images: ['https://placehold.co/600x400/1A1613/D9822B?text=Happy+Hoppy+Hopkins']
                  }
                ]);
                setLoading(false);
              });
          }, []);

          const openBeerModal = (beer) => {
            setSelectedBeer(beer);
            setActiveModalImage(0);
          };

          const safeInventory = Array.isArray(inventory) ? inventory : [];

          const renderBeerCard = (beer) => (
            <div 
              key={beer.id || beer.name} 
              onClick={() => openBeerModal(beer)}
              className="bg-[#1A1613] border border-[#2C2520] rounded-2xl p-6 cursor-pointer hover:border-[#D9822B] transition-colors"
            >
              <div className="flex justify-between items-start mb-4">
                <div>
                  <div className="flex items-center space-x-2 mb-2">
                    <span className="text-xs font-bold tracking-widest text-[#D9822B] uppercase">{beer.tap || beer.status}</span>
                    <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-[#2C2520] text-[#A39686]">
                      {beer.abv}
                    </span>
                  </div>
                  <h3 className="font-serif text-2xl font-bold text-[#F5F0E6] mb-1">{beer.name}</h3>
                  <p className="text-sm text-[#A39686]">{beer.style}</p>
                </div>
                <div className="flex-shrink-0 ml-4">
                  <BeerGlassIcon type={beer.glass || 'Pint'} color={beer.srm} />
                </div>
              </div>
            </div>
          );

          return (
            <div className="min-h-screen bg-[#12100E] text-[#F5F0E6] font-sans selection:bg-[#D9822B] selection:text-white pb-24">
              <header className="px-6 py-8 border-b border-[#2C2520] bg-[#1A1613]">
                <div className="max-w-3xl mx-auto flex items-center space-x-4">
                  <AFLogo />
                  <div>
                    <h1 className="font-serif text-3xl font-bold tracking-tight text-[#F5F0E6]">Fermenting Life</h1>
                    <div className="text-xs tracking-[0.2em] text-[#A39686] uppercase font-semibold">Brewhouse &amp; Taproom</div>
                  </div>
                </div>
              </header>
              
              <div className="sticky top-0 z-30 bg-[#12100E]/90 backdrop-blur border-b border-[#2C2520]">
                <div className="max-w-3xl mx-auto flex overflow-x-auto hide-scrollbar">
                  {['taproom', 'cellar', 'brewhouse', 'labels'].map((tab) => (
                    <button
                      key={tab}
                      onClick={() => setActiveTab(tab)}
                      className={`flex-1 min-w-[100px] py-4 text-xs font-bold tracking-wider uppercase transition-colors whitespace-nowrap ${
                        activeTab === tab ? 'text-[#D9822B] border-b-2 border-[#D9822B]' : 'text-[#8C7A6B] hover:text-[#F5F0E6]'
                      }`}
                    >
                      {tab.replace('-', ' ')}
                    </button>
                  ))}
                </div>
              </div>

              <main className="max-w-3xl mx-auto p-6 space-y-6">
                {loading && (
                  <div className="text-center py-12 text-[#A39686]">Loading live inventory from Google Sheet...</div>
                )}

                {!loading && activeTab === 'taproom' && (
                  <div className="space-y-4">
                    {safeInventory.filter(b => (b.status || '').toLowerCase().includes('tap')).map(renderBeerCard)}
                  </div>
                )}

                {!loading && activeTab === 'cellar' && (
                  <div className="space-y-4">
                    <div className="p-4 bg-[#1A1613] border border-[#2C2520] rounded-xl mb-6 text-sm text-[#A39686]">
                      <span className="text-[#D9822B]">The Cellar</span> holds our bottle-conditioned and vintage high-gravity releases.
                    </div>
                    {safeInventory.filter(b => (b.status || '').toLowerCase().includes('cellar') || (b.status || '').toLowerCase().includes('bottle')).map(renderBeerCard)}
                  </div>
                )}

                {activeTab === 'brewhouse' && (
                  <div className="space-y-8 animate-in fade-in duration-500">
                    <div className="bg-[#1A1613] border border-[#2C2520] rounded-2xl overflow-hidden">
                      <div className="p-8 space-y-6">
                        <h2 className="font-serif text-3xl font-bold text-[#F5F0E6]">The Brewer</h2>
                        <div className="prose prose-invert text-[#C2B6A7] leading-relaxed space-y-4">
                          <p>
                            Lyle "Ale-Xander" Farrell began his brewing journey at age 20 while studying Food Science with a Brewing Emphasis at UC Davis.
                          </p>
                          <p>
                            His professional background spans the globe and the industry, including stints at Wells &amp; Young's in the UK, MillerCoors, and E.J. Phair, along with moonlighting at Heretic Brewing. 
                          </p>
                          <p>
                            Lyle later helped found BuzzWorks, where he collaborated on commercial batches with Black Hammer Brewing, Anderson Valley, and Shadow Puppet Brewing. Today, Fermenting Life is his creative outlet—home brewing for fun, exploration, and simply to stay hydrated.
                          </p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {!loading && activeTab === 'labels' && (
                  <div className="space-y-6 animate-in fade-in duration-300">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {safeInventory.map((beer, idx) => (
                        <div key={idx} className="bg-[#1A1613] border border-[#2C2520] p-5 rounded-2xl flex flex-col items-center text-center">
                          <QrCodeIcon className="w-12 h-12 text-[#A39686] mb-3" />
                          <h3 className="font-serif font-bold text-[#F5F0E6]">{beer.name}</h3>
                          <p className="text-xs text-[#8C7A6B] mb-4">{beer.style}</p>
                          <button onClick={() => window.print()} className="w-full py-2 bg-[#2C2520] text-[#D9822B] text-xs font-bold rounded-lg uppercase tracking-wider flex justify-center items-center">
                            <PrinterIcon className="w-4 h-4 mr-2" /> Print QR
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </main>

              {selectedBeer && (
                <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm p-0 sm:p-6">
                  <div className="w-full max-w-2xl bg-[#12100E] h-[90vh] sm:h-auto sm:max-h-[90vh] sm:rounded-2xl flex flex-col border border-[#2C2520] overflow-hidden shadow-2xl relative">
                    <button 
                      onClick={() => setSelectedBeer(null)}
                      className="absolute top-4 right-4 z-10 p-2 bg-black/50 hover:bg-black/80 text-white rounded-full backdrop-blur transition-colors"
                    >
                      <XIcon />
                    </button>

                    <div className="overflow-y-auto p-6 sm:p-8 space-y-8">
                      <div className="flex justify-between items-start gap-4">
                        <div>
                          <h2 className="font-serif text-3xl font-bold text-[#F5F0E6] mb-2">{selectedBeer.name}</h2>
                          <p className="text-sm font-semibold text-[#D9822B] uppercase tracking-wide">{selectedBeer.style}</p>
                          <p className="text-sm text-[#A39686] mt-1">{selectedBeer.tap || selectedBeer.status} &bull; {selectedBeer.abv} ABV</p>
                        </div>
                        <div className="flex-shrink-0 opacity-80">
                          <BeerGlassIcon type={selectedBeer.glass || 'Pint'} color={selectedBeer.srm} />
                        </div>
                      </div>

                      <div className="prose prose-invert">
                        <p className="text-lg text-[#C2B6A7] leading-relaxed">
                          {selectedBeer.description || selectedBeer.Commercial_Description}
                        </p>
                      </div>

                      {selectedBeer.images && selectedBeer.images.length > 0 && (
                        <div className="space-y-3">
                          <div className="aspect-[3/2] w-full rounded-xl overflow-hidden border border-[#2C2520] bg-black">
                            <img 
                              src={selectedBeer.images[activeModalImage]} 
                              alt="Featured" 
                              className="w-full h-full object-cover"
                            />
                          </div>
                          {selectedBeer.images.length > 1 && (
                            <div className="flex space-x-3 overflow-x-auto hide-scrollbar pb-2">
                              {selectedBeer.images.map((img, idx) => (
                                <button 
                                  key={idx}
                                  onClick={() => setActiveModalImage(idx)}
                                  className={`flex-shrink-0 w-20 h-20 rounded-lg overflow-hidden border-2 transition-all ${activeModalImage === idx ? 'border-[#D9822B] opacity-100' : 'border-transparent opacity-50 hover:opacity-80'}`}
                                >
                                  <img src={img} alt={`Thumb ${idx}`} className="w-full h-full object-cover" />
                                </button>
                              ))}
                            </div>
                          )}
                          {selectedBeer.googlePhotosUrl && (
                            <div className="pt-2">
                              <a 
                                href={selectedBeer.googlePhotosUrl} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="inline-flex items-center text-xs font-bold text-[#D9822B] hover:underline bg-[#1A1613] border border-[#2C2520] px-4 py-3 rounded-lg w-full justify-center transition-colors hover:border-[#D9822B]"
                              >
                                📸 View Shared Google Photos Album / Add Your Pictures
                              </a>
                            </div>
                          )}
                        </div>
                      )}

                      <div className="border border-[#2C2520] rounded-xl p-5 mb-8 bg-[#12100E]">
                        <h4 className="text-[10px] text-[#D9822B] font-bold uppercase tracking-wider mb-3">Ingredients</h4>
                        <p className="text-xs text-[#E8E1D7]">{selectedBeer.Commercial_Ingredients_Disclosure || 'Water, Malted Barley, Hops, Yeast.'}</p>
                      </div>

                      <div className="border border-[#2C2520] rounded-xl p-5 mb-8 bg-[#1A1613]">
                        <h4 className="text-[10px] text-[#D9822B] font-bold uppercase tracking-wider mb-3">Brewer's Log</h4>
                        <p className="text-xs text-[#C2B6A7]">{selectedBeer.Private_Grist || 'Technical formulation locked in brewer log.'}</p>
                      </div>

                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
