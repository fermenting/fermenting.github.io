    function renderBeers(list) {
      const params = new URLSearchParams(window.location.search);
      const highlightSlug = params.get('beer');
      const grid = document.getElementById('grid');
      grid.innerHTML = list.map(b => {
        const isHighlighted = highlightSlug === b.slug;
        return `
          <div class="rounded-2xl bg-[#1A1613] border ${isHighlighted ? 'border-[#D9822B] ring-2 ring-[#D9822B]' : 'border-[#362D26]'} p-6 space-y-4">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded bg-[#D9822B] text-[#12100E] font-extrabold text-xs uppercase">${b.tapSlot || b.status}</span>
              <span class="text-xs font-mono text-[#A89E93]">${b.abv}% ABV • ${b.ibu} IBU • ${b.srm} SRM</span>
            </div>
            <div>
              <h2 class="text-2xl font-bold text-[#F5F0E6]">${b.name}</h2>
              <p class="text-sm font-semibold text-[#D9822B]">${b.subtitle}</p>
            </div>
            <p class="text-sm text-[#CFC6B9] leading-relaxed">${b.description}</p>
            <div class="pt-3 border-t border-[#2A231E] text-xs text-[#A89E93] space-y-1">
              <div><strong class="text-[#F5F0E6]">Ingredients:</strong> ${b.commercialIngredients}</div>
              <div class="text-amber-300 font-bold">⚠️ ${b.allergenWarning}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    renderBeers(FALLBACK_BEERS);
    fetch(WEBHOOK_URL).then(r => r.json()).then(d => {
      if (d && Array.isArray(d.beers) && d.beers.length) {
        console.log('Synced live from Google Sheets:', d.count, 'beers');
      }
    }).catch(() => {});
  </script>
