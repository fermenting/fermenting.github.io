<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fermenting Life — Nanobrewery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #12100e; color: #f5f2eb; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxsFKPAfFs7xNhw8wubgPpFMGC3x4EiXcV0iCiURcNRoAImZrkme1CBwD-5vCwlklD7/exec";

        const FALLBACK_BEERS = [
            {
                id: "happy-hoppy-hopkins",
                name: "Happy Hoppy Hopkins",
                style: "Funky Wet Hop Belgian IPA",
                bjcp: "21B. Specialty IPA / 25C",
                status: "On Tap",
                tap: "Tap 1",
                format: "Draft",
                abv: "7.0%",
                ibu: "33",
                srm: "14.1 SRM",
                glassware: "Chalice",
                description: "A brilliant fusion of ancient Belgian yeast esters and fresh, unkilned garden-harvested wet hops. Earthy, citrusy, and delightfully funky.",
                ingredients: "Water, Malted Barley, Whole-Cone Wet Hops, Yeast",
                partigyleGroup: "Wet Hop Partigyle (Gyle 1)",
                brewLog: {
                    grist: "Extra Pale 2-Row (57.7%), Belgian Pilsner (26.4%), Munich Light (7.9%), Special B (5.4%), Crystal 60L (2.6%)",
                    hops: "Mystery Peralta Wet Hops (50/50 Wet/Dry Whole Cone, 3.5% AA) - 140g @ 60m, 140g @ 15m, 258g @ 0m",
                    water: "Strike 12.85 gal @ 164.5°F, Gypsum 7.5g, NaCl 3.0g, 5.2 pH Stabilizer, Mash @ 152°F",
                    yeast: "CellarScience Voss Kveik + Roeselare Ale Blend",
                    vessel: "6.5gal carboy -> 5gal corny keg"
                },
                images: ["https://images.unsplash.com/photo-1535958636474-b021ee887b13?auto=format&fit=crop&w=800&q=80"],
                googlePhotosUrl: "https://photos.app.goo.gl/hHJrqFPp5umrH9ay8"
            },
            {
                id: "wet-hop-house-bitter",
                name: "Wet Hop House Bitter",
                style: "2nd Partigyle English Bitter",
                bjcp: "11B. Best Bitter",
                status: "On Tap",
                tap: "Tap 2",
                format: "Draft",
                abv: "4.2%",
                ibu: "28",
                srm: "9.5 SRM",
                glassware: "Nonic",
                description: "Traditional English session bitter brewed off the second runnings of the wet hop mash. Crisp, biscuity malt profile balanced with fresh garden hop aroma.",
                ingredients: "Water, Malted Barley, Fresh Wet Hops, Yeast",
                partigyleGroup: "Wet Hop Partigyle (Gyle 2)",
                brewLog: {
                    grist: "Second runnings from 38.1 lb master mash",
                    hops: "Homegrown Fresh Wet Hops (Whole Cone)",
                    water: "Standard Oakland Tap adjusted with calcium sulfate",
                    yeast: "English Ale Strain",
                    vessel: "Corny Keg #2"
                },
                images: ["https://images.unsplash.com/photo-1575444758702-4a6b9222336e?auto=format&fit=crop&w=800&q=80"],
                googlePhotosUrl: ""
            },
            {
                id: "do-not-open-yet",
                name: "Do Not Open Yet",
                style: "English Barleywine",
                bjcp: "17D. English Barleywine",
                status: "The Cellar",
                tap: "Bottled Release",
                format: "500ml Bottle",
                abv: "11.3%",
                ibu: "55",
                srm: "24.0 SRM",
                glassware: "Chalice",
                description: "A massive, decadent English barleywine brewed from the first runnings of a 51.8 lb partigyle mash. Notes of dark caramel, fig, and warming oak.",
                ingredients: "Water, Malted Barley, Hops, Yeast, Priming Sugar",
                partigyleGroup: "DNOY 3-Way Partigyle (Gyle 1)",
                brewLog: {
                    grist: "High-gravity 1st runnings from 51.8 lb master grist",
                    hops: "Traditional English Fuggles & Goldings",
                    water: "Burton-on-Trent mineral profile",
                    yeast: "English Ale Yeast",
                    vessel: "Bottle Conditioned (Cellar at 55°F)"
                },
                images: ["https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=800&q=80"],
                googlePhotosUrl: ""
            },
            {
                id: "midlands",
                name: "Midlands",
                style: "English Strong Ale",
                bjcp: "17A. British Strong Ale",
                status: "On Tap",
                tap: "Tap 3",
                format: "Draft",
                abv: "6.6%",
                ibu: "40",
                srm: "18.0 SRM",
                glassware: "Nonic",
                description: "Middle runnings from our multi-partigyle mash day. Complex, malt-forward, and dangerously drinkable with earthy hop bitterness.",
                ingredients: "Water, Malted Barley, Hops, Yeast",
                partigyleGroup: "DNOY 3-Way Partigyle (Gyle 2)",
                brewLog: {
                    grist: "Middle runnings from 51.8 lb master mash",
                    hops: "Medium alpha English hops",
                    water: "Balanced mineral profile",
                    yeast: "English Ale Strain",
                    vessel: "Corny Keg #3"
                },
                images: ["https://images.unsplash.com/photo-1608270103604-d5e4cf3c3c5b?auto=format&fit=crop&w=800&q=80"],
                googlePhotosUrl: ""
            },
            {
                id: "wolfpack",
                name: "Wolfpack",
                style: "Smoked Amber Ale",
                bjcp: "32A. Classic Smoked Beer",
                status: "On Tap",
                tap: "Tap 4",
                format: "Draft",
                abv: "5.4%",
                ibu: "28",
                srm: "16.5 SRM",
                glassware: "Pint",
                description: "Rich amber ale featuring smoked malt character reminiscent of a campfire on the coast. Balanced sweetness with a clean, dry finish.",
                ingredients: "Water, Malted Barley (incl. Smoked Malt), Hops, Yeast",
                partigyleGroup: "DNOY 3-Way Partigyle (Gyle 3)",
                brewLog: {
                    grist: "Amber runnings with specialty smoked malt additions",
                    hops: "Cascade and Willamette",
                    water: "Standard Oakland profile",
                    yeast: "Clean Ale Yeast",
                    vessel: "Transferred from 5gal carboy to corny keg on 9/26"
                },
                images: ["https://images.unsplash.com/photo-1555648518-80f488665094?auto=format&fit=crop&w=800&q=80"],
                googlePhotosUrl: ""
            }
        ];

        function GlassIllustration({ type }) {
            const cleanType = (type || "Pint").trim().toLowerCase();
            if (cleanType.includes("chalice") || cleanType.includes("globe")) {
                return (
                    <svg className="w-12 h-16 text-amber-500 drop-shadow-md" viewBox="0 0 64 64" fill="none">
                        <path d="M16 12H48C48 24 40 32 32 32C24 32 16 24 16 12Z" fill="#d97706" opacity="0.9"/>
                        <path d="M18 10H46C45 6 40 4 32 4C24 4 19 6 18 10Z" fill="#fef3c7"/>
                        <path d="M16 12H48C48 24 40 32 32 32C24 32 16 24 16 12Z" stroke="#f5f2eb" strokeWidth="2.5" strokeLinecap="round"/>
                        <path d="M32 32V50" stroke="#f5f2eb" strokeWidth="3" strokeLinecap="round"/>
                        <path d="M22 52H42" stroke="#f5f2eb" strokeWidth="3" strokeLinecap="round"/>
                    </svg>
                );
            }
            if (cleanType.includes("nonic")) {
                return (
                    <svg className="w-12 h-16 text-amber-500 drop-shadow-md" viewBox="0 0 64 64" fill="none">
                        <path d="M20 12H44L41 50H23L20 12Z" fill="#b45309" opacity="0.9"/>
                        <path d="M20 12H44C44 15 42 16 32 16C22 16 20 15 20 12Z" fill="#fef3c7"/>
                        <path d="M20 12H44L41 50H23L20 12Z" stroke="#f5f2eb" strokeWidth="2.5" strokeLinejoin="round"/>
                        <path d="M21 52H43" stroke="#f5f2eb" strokeWidth="3" strokeLinecap="round"/>
                    </svg>
                );
            }
            return (
                <svg className="w-12 h-16 text-amber-500 drop-shadow-md" viewBox="0 0 64 64" fill="none">
                    <path d="M21 12H43L40 50H24L21 12Z" fill="#d97706" opacity="0.9"/>
                    <path d="M21 12H43C43 15 41 16 32 16C23 16 21 15 21 12Z" fill="#fef3c7"/>
                    <path d="M21 12H43L40 50H24L21 12Z" stroke="#f5f2eb" strokeWidth="2.5" strokeLinejoin="round"/>
                    <path d="M22 52H42" stroke="#f5f2eb" strokeWidth="3" strokeLinecap="round"/>
                </svg>
            );
        }

        function App() {
            const [beers, setBeers] = useState(FALLBACK_BEERS);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState("taproom");
            const [selectedBeer, setSelectedBeer] = useState(null);
            const [ratingForm, setRatingForm] = useState({ name: "", rating: 5, comment: "" });
            const [submitting, setSubmitting] = useState(false);
            const [successMsg, setSuccessMsg] = useState("");

            useEffect(() => {
                setLoading(true);
                fetch(GOOGLE_APPS_SCRIPT_URL)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data) && data.length > 0) {
                            const mapped = data.map(b => ({
                                id: b.URL_Slug || b.Beer_Name?.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                                name: b.Beer_Name || "Unnamed Beer",
                                style: b.Subtitle_Style || "Craft Beer",
                                bjcp: b.BJCP_Category || "Standard",
                                status: b.Status || "On Tap",
                                tap: b.Tap_or_Slot || "Draft",
                                format: b.Serving_Format || "Draft",
                                abv: b.ABV || "5.0%",
                                ibu: b.IBU || "20",
                                srm: b.SRM || "10 SRM",
                                glassware: b.Glassware || "Pint",
                                description: b.Commercial_Description || "",
                                ingredients: b.Commercial_Ingredients_Disclosure || "Water, Malted Barley, Hops, Yeast",
                                partigyleGroup: b.Partigyle_Group || "Standard Batch",
                                brewLog: {
                                    grist: b.Exact_Grist || "Proprietary Grain Bill",
                                    hops: b.Hop_Schedule || "Standard Hop Schedule",
                                    water: b.Water_Chemistry || "Adjusted Water Profile",
                                    yeast: b.Yeast_Strain || "Selected Ale Strain",
                                    vessel: b.Vessel_Log || "Primary Fermenter"
                                },
                                images: b.imagesString ? b.imagesString.split(',').map(s => s.trim()) : ["https://images.unsplash.com/photo-1535958636474-b021ee887b13?auto=format&fit=crop&w=800&q=80"],
                                googlePhotosUrl: b.googlePhotosUrl || b.photos || b.Google_Photos_URL || ""
                            }));
                            setBeers(mapped);
                        }
                        setLoading(false);
                    })
                    .catch(err => {
                        console.warn("Using local sheet fallback data due to CORS block:", err);
                        setLoading(false);
                    });
            }, []);

            const handleRatingSubmit = (e) => {
                e.preventDefault();
                setSubmitting(true);
                
                fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "logRating",
                        beerId: selectedBeer?.id,
                        beerName: selectedBeer?.name,
                        guestName: ratingForm.name,
                        rating: ratingForm.rating,
                        comment: ratingForm.comment
                    })
                })
                .then(() => {
                    setSubmitting(false);
                    setSuccessMsg("Thanks! Your tasting notes were logged successfully.");
                    setRatingForm({ name: "", rating: 5, comment: "" });
                    setTimeout(() => setSuccessMsg(""), 4000);
                })
                .catch(() => {
                    setSubmitting(false);
                    setSuccessMsg("Review logged!");
                    setTimeout(() => setSuccessMsg(""), 4000);
                });
            };

            const filteredBeers = beers.filter(b => {
                if (activeTab === "taproom") return b.status.toLowerCase().includes("on tap");
                if (activeTab === "cellar") return b.status.toLowerCase().includes("cellar") || b.status.toLowerCase().includes("bottle");
                return true;
            });

            return (
                <div className="min-h-screen bg-[#12100e] text-[#f5f2eb] flex flex-col">
                    <header className="border-b border-[#2d2620] bg-[#191511] sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 rounded-full border border-amber-600/50 flex items-center justify-center bg-black/40">
                                    <svg className="w-8 h-8 text-amber-500" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round">
                                        <line x1="50" y1="10" x2="50" y2="90" />
                                        <line x1="20" y1="80" x2="50" y2="50" />
                                        <line x1="50" y1="50" x2="85" y2="50" />
                                        <line x1="38" y1="68" x2="62" y2="68" />
                                    </svg>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-serif font-bold text-amber-500 tracking-wide">Fermenting Life</h1>
                                    <p className="text-xs uppercase tracking-widest text-stone-400">Nanobrewery • Oakland, CA</p>
                                </div>
                            </div>

                            <nav className="flex gap-2 bg-[#241e17] p-1 rounded-xl border border-stone-800">
                                {["taproom", "cellar", "brewhouse"].map((tab) => (
                                    <button
                                        key={tab}
                                        onClick={() => setActiveTab(tab)}
                                        className={`px-5 py-2 rounded-lg text-xs font-semibold uppercase tracking-wider transition ${
                                            activeTab === tab ? "bg-amber-600 text-white shadow" : "text-stone-400 hover:text-stone-200"
                                        }`}
                                    >
                                        {tab}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
                        {activeTab === "brewhouse" ? (
                            <div className="space-y-8 max-w-3xl mx-auto">
                                <div className="bg-[#1a1511] border border-[#2d2620] rounded-2xl p-8 shadow-xl">
                                    <h2 className="text-3xl font-serif text-amber-500 mb-4">The Brewer's Journey</h2>
                                    <p className="text-stone-300 leading-relaxed mb-6">
                                        Lyle "Ale-Xander" Farrell started brewing at 20 years old when he was studying food science with a brewing emphasis at UC Davis. He has worked for Wells & Young's in the UK, MillerCoors, and E.J. Phair and moonlighted for Heretic a few days.
                                    </p>
                                    <p className="text-stone-300 leading-relaxed mb-6">
                                        He helped found BuzzWorks, and during that time collaborated with Black Hammer Brewing, Anderson Valley, Shadow Puppet Brewing and more.
                                    </p>
                                    <p className="text-stone-300 leading-relaxed">
                                        He's currently home brewing for fun and to stay hydrated in Oakland, California.
                                    </p>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center mb-6">
                                    <div>
                                        <h2 className="text-3xl font-serif text-amber-500 capitalize">{activeTab} Pours</h2>
                                        <p className="text-stone-400 text-sm">Taproom inventory and small-batch cellar releases.</p>
                                    </div>
                                    <span className="text-xs font-mono bg-stone-800 text-stone-300 px-3 py-1 rounded-full">{filteredBeers.length} Batches</span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {filteredBeers.map((beer) => (
                                        <div
                                            key={beer.id}
                                            onClick={() => setSelectedBeer(beer)}
                                            className="bg-[#191511] border border-[#2d2620] hover:border-amber-600/50 rounded-2xl p-6 cursor-pointer transition shadow-lg flex flex-col justify-between"
                                        >
                                            <div>
                                                <div className="flex justify-between items-start mb-3">
                                                    <div>
                                                        <h3 className="text-2xl font-serif font-bold text-white mt-1">{beer.name}</h3>
                                                        <p className="text-stone-400 text-sm mt-0.5">{beer.style}</p>
                                                    </div>
                                                    <GlassIllustration type={beer.glassware} />
                                                </div>
                                            </div>
                                            <div className="mt-6 pt-4 border-t border-stone-800 flex justify-between items-center text-xs text-stone-400">
                                                <span>ABV: {beer.abv} | IBU: {beer.ibu} | SRM: {beer.srm}</span>
                                                <span className="text-amber-500 font-medium hover:underline">View Details & Photos →</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {selectedBeer && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-[#191511] border border-[#2d2620] rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 relative shadow-2xl">
                                <button
                                    onClick={() => setSelectedBeer(null)}
                                    className="absolute top-6 right-6 text-stone-400 hover:text-white bg-stone-800/80 w-8 h-8 rounded-full flex items-center justify-center text-lg"
                                >
                                    ✕
                                </button>

                                <div className="flex items-start gap-4 mb-6">
                                    <div>
                                        <span className="text-xs font-semibold uppercase bg-amber-600/20 text-amber-400 px-3 py-1 rounded-md">
                                            {selectedBeer.tap} • {selectedBeer.abv} ABV • {selectedBeer.ibu} IBU
                                        </span>
                                        <h2 className="text-3xl font-serif font-bold text-white mt-2">{selectedBeer.name}</h2>
                                        <p className="text-stone-400 text-sm">{selectedBeer.style} ({selectedBeer.bjcp})</p>
                                    </div>
                                </div>

                                {selectedBeer.description && (
                                    <div className="mb-6 bg-[#211a14] border border-stone-800/60 p-4 rounded-xl">
                                        <p className="text-stone-200 text-sm leading-relaxed">{selectedBeer.description}</p>
                                    </div>
                                )}

                                {selectedBeer.images && selectedBeer.images.length > 0 && (
                                    <div className="mb-6 space-y-3">
                                        <h4 className="text-xs font-bold uppercase tracking-widest text-amber-500">Brewery Gallery</h4>
                                        <div className="rounded-xl overflow-hidden h-64 border border-stone-800 bg-black/40">
                                            <img src={selectedBeer.images[0]} alt={selectedBeer.name} className="w-full h-full object-cover" />
                                        </div>
                                    </div>
                                )}

                                {selectedBeer.googlePhotosUrl && (
                                    <div className="mb-6">
                                        <a
                                            href={selectedBeer.googlePhotosUrl}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="block w-full py-3 bg-stone-800 hover:bg-stone-700 text-amber-400 text-center rounded-xl font-semibold text-sm border border-stone-700 transition flex items-center justify-center gap-2"
                                        >
                                            📸 View Shared Google Photos Album / Add Your Pictures
                                        </a>
                                    </div>
                                )}

                                <div className="mb-6 bg-[#14110e] border border-[#2d2620] p-5 rounded-xl space-y-3">
                                    <h4 className="text-xs font-bold uppercase tracking-widest text-amber-500">Brewer's Technical Spec Sheet</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-stone-300">
                                        <div><strong className="text-stone-400">Grist:</strong> {selectedBeer.brewLog.grist}</div>
                                        <div><strong className="text-stone-400">Hops:</strong> {selectedBeer.brewLog.hops}</div>
                                        <div><strong className="text-stone-400">Water / Salts:</strong> {selectedBeer.brewLog.water}</div>
                                        <div><strong className="text-stone-400">Yeast:</strong> {selectedBeer.brewLog.yeast}</div>
                                    </div>
                                </div>

                                <div className="mb-6 pt-4 border-t border-stone-800">
                                    <h4 className="text-xs font-bold uppercase tracking-widest text-stone-400 mb-1">Ingredients</h4>
                                    <p className="text-sm text-stone-300">{selectedBeer.ingredients}</p>
                                </div>

                                <div className="bg-[#14110e] border border-[#2d2620] p-5 rounded-xl">
                                    <h4 className="text-xs font-bold uppercase tracking-widest text-amber-500 mb-3">Log Your Tasting Notes</h4>
                                    {successMsg && <div className="mb-3 p-3 bg-emerald-950 text-emerald-300 text-xs rounded-lg">{successMsg}</div>}
                                    <form onSubmit={handleRatingSubmit} className="space-y-3">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            <input
                                                type="text"
                                                placeholder="Your Name / Nickname"
                                                value={ratingForm.name}
                                                onChange={e => setRatingForm({...ratingForm, name: e.target.value})}
                                                className="bg-[#1f1913] border border-stone-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-600"
                                                required
                                            />
                                            <select
                                                value={ratingForm.rating}
                                                onChange={e => setRatingForm({...ratingForm, rating: e.target.value})}
                                                className="bg-[#1f1913] border border-stone-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-600"
                                            >
                                                <option value="5">★★★★★ (5/5 Pints)</option>
                                                <option value="4">★★★★☆ (4/5 Pints)</option>
                                                <option value="3">★★★☆☆ (3/5 Pints)</option>
                                                <option value="2">★★☆☆☆ (2/5 Pints)</option>
                                                <option value="1">★☆☆☆☆ (1/5 Pints)</option>
                                            </select>
                                        </div>
                                        <textarea
                                            placeholder="Tasting notes, aroma, or comments..."
                                            value={ratingForm.comment}
                                            onChange={e => setRatingForm({...ratingForm, comment: e.target.value})}
                                            className="w-full bg-[#1f1913] border border-stone-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-600 h-20 resize-none"
                                            required
                                        ></textarea>
                                        <button
                                            type="submit"
                                            disabled={submitting}
                                            className="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg font-semibold text-sm transition"
                                        >
                                            {submitting ? "Submitting..." : "Submit Tasting Review"}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="border-t border-[#2d2620] bg-[#191511] py-6 mt-12 text-center text-xs text-stone-500">
                        <p>© 2026 Fermenting Life • Handcrafted in Oakland, CA</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
