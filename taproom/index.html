<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linden Street Brewhouse</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (Development versions for standalone use) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Hide scrollbar for clean horizontal scrolling tabs */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#12100E]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SVGs & Helpers ---
    const BeerGlassSVG = ({ srm, glassware }) => {
      const srmColors = {
        2: '#F8F096', 3: '#F2DF71', 4: '#EAD14F', 5: '#E1C233', 6: '#D5B01A', 
        7: '#C9A105', 8: '#B98D00', 9: '#AF8100', 10: '#A37400', 11: '#986800', 
        12: '#8E5B00', 13: '#855100', 14: '#7C4600', 15: '#733D00', 16: '#693400', 
        17: '#612C00', 18: '#592400', 19: '#521D00', 20: '#4B1600', 25: '#290600', 
        30: '#140000', 40: '#030000'
      };
      const hex = srmColors[Math.min(Math.round(srm || 4), 40)] || '#EAD14F';
      
      if (glassware === 'Nonic') {
        return (
          <svg width="100%" height="100%" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 2L4 6Q2 9 5 12L8 30H16L19 12Q22 9 20 6L19 2Z" fill="white" fillOpacity="0.1" stroke="#F5F0E6" strokeWidth="1.5" strokeLinejoin="round"/>
            <path d="M2.7 8Q2 9 5 12L7.7 29H16.3L19 12Q22 9 21.3 8Z" fill={hex}/>
            <path d="M5 2L4 6Q3.4 7.2 2.7 8H21.3Q20.6 7.2 20 6L19 2Z" fill="#F5F0E6" fillOpacity="0.9"/>
          </svg>
        );
      }
      
      if (glassware === 'Chalice') {
        return (
          <svg width="100%" height="100%" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 2V8C4 18 11 20 11 20V30H7V32H17V30H13V20C13 20 20 18 20 8V2Z" fill="white" fillOpacity="0.1" stroke="#F5F0E6" strokeWidth="1.5" strokeLinejoin="round"/>
            <path d="M4 8C4 17.5 10.5 19.2 11.5 19.2H12.5C13.5 19.2 20 17.5 20 8Z" fill={hex}/>
            <path d="M4 2V8H20V2Z" fill="#F5F0E6" fillOpacity="0.9"/>
          </svg>
        );
      }

      return (
        <svg width="100%" height="100%" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 2L7 30H17L20 2Z" fill="white" fillOpacity="0.1" stroke="#F5F0E6" strokeWidth="1.5" strokeLinejoin="round"/>
          <path d="M4.6 8L6.8 29H17.2L19.4 8Z" fill={hex}/>
          <path d="M4 2L4.6 8H19.4L20 2Z" fill="#F5F0E6" fillOpacity="0.9"/>
        </svg>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('taproom');
      const [brewerAdmin, setBrewerAdmin] = useState(false);
      const [selectedBeer, setSelectedBeer] = useState(null);
      const [showAdminLogin, setShowAdminLogin] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [activePartigyle, setActivePartigyle] = useState(null);

      // Inventory Data
      const inventory = [
        {
          Batch_ID: '001', URL_Slug: 'happy-hoppy-hopkins', Beer_Name: 'Happy Hoppy Hopkins',
          Subtitle_Style: 'Funky Wet Hop Belgian IPA', BJCP_Category: '21B/25C', Status: 'On Tap',
          Tap_or_Slot: 'Tap 1', Serving_Format: 'Draft', ABV: '7.0%', IBU: '33', SRM: 14.1, Glassware: 'Chalice',
          Commercial_Description: 'A wild, funky ride. Wet hops fresh from the community garden layered over a Belgian Golden Strong base with Roeselare blend.',
          Commercial_Ingredients_Disclosure: 'Water, Malted Barley, Whole-Cone Wet Hops, Yeast.',
          Allergen_Warning: 'Contains: Gluten (Malted Barley)',
          Partigyle_Group: 'Wet Hop Partigyle (Gyle 1)',
          Private_Grist: '57.7% Extra Pale 2-Row, 26.4% Belgian Pilsner, 7.9% Munich Light, 5.4% Special B'
        },
        {
          Batch_ID: '002', URL_Slug: 'wet-hop-house-bitter', Beer_Name: 'Wet Hop House Bitter',
          Subtitle_Style: '2nd Partigyle English Bitter', BJCP_Category: '11B', Status: 'On Tap',
          Tap_or_Slot: 'Tap 2', Serving_Format: 'Draft', ABV: '4.2%', IBU: '28', SRM: 9.5, Glassware: 'Nonic',
          Commercial_Description: 'The second runnings of our wet hop mash. A crushable, malt-forward pub ale with an expressive fresh-hop aroma.',
          Commercial_Ingredients_Disclosure: 'Water, Malted Barley, Fresh Wet Hops, Yeast.',
          Allergen_Warning: 'Contains: Gluten (Malted Barley)',
          Partigyle_Group: 'Wet Hop Partigyle (Gyle 2)',
          Private_Grist: 'Second runnings of 38.1 lb master mash.'
        },
        {
          Batch_ID: '003', URL_Slug: 'do-not-open-yet', Beer_Name: 'Do Not Open Yet',
          Subtitle_Style: 'English Barleywine', BJCP_Category: '17D', Status: 'The Cellar',
          Tap_or_Slot: 'Cellar Reserve', Serving_Format: 'Bottle Conditioned', ABV: '11.3%', IBU: '55', SRM: 24, Glassware: 'Chalice',
          Commercial_Description: 'A massive, complex barleywine. First runnings of a 3-way partigyle split. Needs years to peak.',
          Commercial_Ingredients_Disclosure: 'Water, Malted Barley, Hops, Yeast, Priming Sugar.',
          Allergen_Warning: 'Contains: Gluten (Malted Barley)',
          Cellar_Format_and_Aging_Notes: 'Hold until Winter 2027–2030. Cellar at 55°F.',
          Partigyle_Group: 'English 3-Way (Gyle 1)',
          Private_Grist: 'First runnings of 51.8 lb master mash. OG: 1.108.'
        },
        {
          Batch_ID: '004', URL_Slug: 'midlands', Beer_Name: 'Midlands',
          Subtitle_Style: 'English Strong Ale', BJCP_Category: '17A', Status: 'On Tap',
          Tap_or_Slot: 'Tap 3', Serving_Format: 'Draft', ABV: '6.6%', IBU: '40', SRM: 18, Glassware: 'Nonic',
          Commercial_Description: 'Rich, caramel-driven, and balanced. The middle child of our massive English mash.',
          Commercial_Ingredients_Disclosure: 'Water, Malted Barley, Hops, Yeast.',
          Allergen_Warning: 'Contains: Gluten (Malted Barley)',
          Partigyle_Group: 'English 3-Way (Gyle 2)',
          Private_Grist: 'Middle runnings of 51.8 lb master mash.'
        },
        {
          Batch_ID: '005', URL_Slug: 'wolfpack', Beer_Name: 'Wolfpack',
          Subtitle_Style: 'Smoked Amber Ale', BJCP_Category: '32A', Status: 'On Tap',
          Tap_or_Slot: 'Tap 4', Serving_Format: 'Draft', ABV: '5.4%', IBU: '28', SRM: 16.5, Glassware: 'Pint',
          Commercial_Description: 'Steeped with smoked malt in the third runnings. Savory, malty, and incredibly drinkable.',
          Commercial_Ingredients_Disclosure: 'Water, Malted Barley (Smoked), Hops, Yeast.',
          Allergen_Warning: 'Contains: Gluten (Malted Barley)',
          Partigyle_Group: 'English 3-Way (Gyle 3)',
          Private_Grist: 'Third runnings of 51.8 lb master mash + Smoked Malt steep.'
        }
      ];

      const activeBeers = inventory.filter(b => b.Status === 'On Tap');
      const cellarBeers = inventory.filter(b => b.Status === 'The Cellar');

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '1975' || pinInput === 'demo') {
          setBrewerAdmin(true);
          setShowAdminLogin(false);
          setPinInput('');
        } else {
          setPinInput('');
        }
      };

      return (
        <div className="min-h-screen text-[#F5F0E6] font-sans selection:bg-[#D9822B] selection:text-white">
          <header className="border-b border-[#2C2520] bg-[#1A1613] sticky top-0 z-40">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-[#D9822B] flex items-center justify-center font-serif text-xl font-bold text-[#12100E]">LS</div>
                <div>
                  <h1 className="font-serif text-xl font-bold tracking-tight text-[#F5F0E6]">Linden Street</h1>
                  <div className="text-[10px] tracking-[0.2em] text-[#A39686] uppercase font-semibold">Brewhouse</div>
                </div>
              </div>
              <div className="flex gap-4">
                <button onClick={() => setShowAdminLogin(true)} className="text-[#A39686] text-xs font-bold uppercase tracking-wider hover:text-white transition-colors">
                  {brewerAdmin ? '🔓 Admin' : '🔒 Login'}
                </button>
              </div>
            </div>
            
            <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto hide-scrollbar border-t border-[#2C2520]">
              {['taproom', 'cellar', 'brewhouse', ...(brewerAdmin ? ['labels'] : [])].map(tab => (
                <button
                  key={tab}
                  onClick={() => setActiveTab(tab)}
                  className={`px-5 py-4 text-xs font-bold uppercase tracking-wider whitespace-nowrap border-b-2 transition-colors ${
                    activeTab === tab ? 'border-[#D9822B] text-[#D9822B]' : 'border-transparent text-[#8E8275] hover:text-[#C2B6A7]'
                  }`}
                >
                  {tab === 'taproom' ? 'On Tap' : tab === 'labels' ? '🖨️ QR Studio' : tab}
                </button>
              ))}
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            {activeTab === 'taproom' && (
              <div className="space-y-10">
                <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                  <div>
                    <h2 className="font-serif text-3xl font-bold text-[#F5F0E6]">Currently Pouring</h2>
                    <p className="text-[#A39686] text-sm mt-1">Live from the draft system.</p>
                  </div>
                  <div className="flex gap-2">
                    <button 
                      onClick={() => setActivePartigyle(activePartigyle === 'Wet Hop Partigyle' ? null : 'Wet Hop Partigyle')}
                      className={`text-[10px] font-bold uppercase px-3 py-1.5 rounded-full border transition-colors ${activePartigyle === 'Wet Hop Partigyle' ? 'bg-[#D9822B] text-[#12100E] border-[#D9822B]' : 'bg-[#1A1613] text-[#A39686] border-[#2C2520]'}`}
                    >
                      Highlight: Wet Hop Split
                    </button>
                    <button 
                      onClick={() => setActivePartigyle(activePartigyle === 'English 3-Way' ? null : 'English 3-Way')}
                      className={`text-[10px] font-bold uppercase px-3 py-1.5 rounded-full border transition-colors ${activePartigyle === 'English 3-Way' ? 'bg-[#D9822B] text-[#12100E] border-[#D9822B]' : 'bg-[#1A1613] text-[#A39686] border-[#2C2520]'}`}
                    >
                      Highlight: 3-Way English
                    </button>
                  </div>
                </div>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {activeBeers.map(beer => {
                    const isHighlighted = activePartigyle && beer.Partigyle_Group?.includes(activePartigyle);
                    const isFaded = activePartigyle && !isHighlighted;
                    
                    return (
                      <div 
                        key={beer.Batch_ID} 
                        onClick={() => setSelectedBeer(beer)}
                        className={`bg-[#1A1613] border border-[#2C2520] rounded-2xl p-6 cursor-pointer hover:border-[#D9822B] transition-all group ${isFaded ? 'opacity-30 grayscale' : ''} ${isHighlighted ? 'ring-1 ring-[#D9822B]' : ''}`}
                      >
                        <div className="flex justify-between items-start mb-4">
                          <div className="flex items-center gap-4">
                            <div className="w-12 h-16 flex items-center justify-center opacity-90 group-hover:scale-110 transition-transform">
                              <BeerGlassSVG srm={beer.SRM} glassware={beer.Glassware} />
                            </div>
                            <div>
                              <div className="text-[10px] font-bold tracking-widest text-[#D9822B] uppercase mb-1">{beer.Tap_or_Slot}</div>
                              <h3 className="font-serif text-xl font-bold text-[#F5F0E6] group-hover:text-[#D9822B] transition-colors">{beer.Beer_Name}</h3>
                              <div className="text-sm text-[#A39686]">{beer.Subtitle_Style}</div>
                            </div>
                          </div>
                          <div className="text-right">
                            <div className="text-lg font-bold text-[#F5F0E6]">{beer.ABV}</div>
                            <div className="text-[10px] text-[#8E8275] uppercase tracking-wider">ABV</div>
                          </div>
                        </div>
                        {beer.Partigyle_Group && (
                          <div className="inline-block bg-[#12100E] border border-[#2C2520] rounded px-2 py-1 text-[10px] text-[#A39686] uppercase mb-4">
                            🧬 {beer.Partigyle_Group}
                          </div>
                        )}
                        <p className="text-sm text-[#C2B6A7] line-clamp-2">{beer.Commercial_Description}</p>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'cellar' && (
              <div className="space-y-10">
                <div>
                  <h2 className="font-serif text-3xl font-bold text-[#F5F0E6]">The Cellar</h2>
                  <p className="text-[#A39686] text-sm mt-1">Bottle-conditioned and vintage releases.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {cellarBeers.map(beer => (
                    <div key={beer.Batch_ID} onClick={() => setSelectedBeer(beer)} className="bg-[#1A1613] border border-[#2C2520] rounded-2xl p-6 cursor-pointer hover:border-[#D9822B] transition-all group">
                      <div className="flex justify-between items-start mb-4">
                        <div>
                          <div className="text-[10px] font-bold tracking-widest text-[#A39686] uppercase mb-1">Vintage Reserve</div>
                          <h3 className="font-serif text-2xl font-bold text-[#F5F0E6] group-hover:text-[#D9822B] transition-colors">{beer.Beer_Name}</h3>
                          <div className="text-sm text-[#D9822B] font-semibold">{beer.Subtitle_Style}</div>
                        </div>
                        <div className="text-right">
                          <div className="text-xl font-bold text-[#F5F0E6]">{beer.ABV}</div>
                          <div className="text-[10px] text-[#8E8275] uppercase tracking-wider">ABV</div>
                        </div>
                      </div>
                      <div className="bg-[#12100E] rounded-lg p-3 border border-[#2C2520] mb-4">
                        <div className="text-[10px] text-[#D9822B] font-bold uppercase mb-1">Cellarmaster Notes</div>
                        <div className="text-xs text-[#A39686]">{beer.Cellar_Format_and_Aging_Notes}</div>
                      </div>
                      <p className="text-sm text-[#C2B6A7]">{beer.Commercial_Description}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'brewhouse' && (
              <div className="bg-[#1A1613] border border-[#2C2520] rounded-2xl p-6 sm:p-8 space-y-4">
                <span className="text-xs font-mono uppercase tracking-widest text-[#D9822B]">Philosophy & Pedigree</span>
                <h1 className="font-serif text-3xl font-bold text-[#F5F0E6]">Commercial Discipline. Homegrown Soul.</h1>
                <p className="text-sm text-[#C2B6A7] leading-relaxed">Trained in professional brewing operations and quality control, Linden Street Brewhouse applies commercial wort production, water chemistry adjustment, and multi-vessel partigyle mashing to small-batch artisan releases.</p>
              </div>
            )}
          </main>

          {selectedBeer && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm p-4 sm:p-6" onClick={() => setSelectedBeer(null)}>
              <div className="w-full max-w-2xl bg-[#1A1613] border border-[#2C2520] rounded-3xl overflow-hidden shadow-2xl relative max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>
                <button onClick={() => setSelectedBeer(null)} className="absolute top-4 right-4 z-10 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center hover:bg-black/80">&times;</button>
                <div className="overflow-y-auto hide-scrollbar p-6 sm:p-10">
                  <div className="flex gap-6 mb-6 items-start">
                    <div className="w-16 h-24 flex-shrink-0"><BeerGlassSVG srm={selectedBeer.SRM} glassware={selectedBeer.Glassware} /></div>
                    <div>
                      <div className="text-[10px] font-bold text-[#D9822B] uppercase tracking-widest mb-1">{selectedBeer.Tap_or_Slot}</div>
                      <h2 className="font-serif text-3xl sm:text-4xl font-bold text-[#F5F0E6] mb-1">{selectedBeer.Beer_Name}</h2>
                      <div className="text-[#A39686] font-medium">{selectedBeer.Subtitle_Style}</div>
                    </div>
                  </div>

                  <p className="text-[#C2B6A7] leading-relaxed mb-8">{selectedBeer.Commercial_Description}</p>

                  <div className="border border-[#2C2520] rounded-xl p-5 mb-8 bg-[#12100E]">
                    <h4 className="text-[10px] text-[#D9822B] font-bold uppercase tracking-wider mb-3">Ingredients</h4>
                    <p className="text-xs text-[#E8E1D7]">{selectedBeer.Commercial_Ingredients_Disclosure}</p>
                  </div>

                  {brewerAdmin && (
                    <div className="border border-indigo-900/50 rounded-xl p-5 mb-8 bg-indigo-950/20">
                      <h4 className="text-[10px] text-indigo-400 font-bold uppercase tracking-wider mb-3">🔒 Private Brew Log</h4>
                      <p className="text-xs text-indigo-200">{selectedBeer.Private_Grist}</p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {showAdminLogin && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-[#1A1613] border border-[#2C2520] rounded-2xl p-6 relative">
                <button onClick={() => setShowAdminLogin(false)} className="absolute top-4 right-4 text-[#A39686] hover:text-white">&times;</button>
                <h3 className="font-serif text-xl font-bold text-[#F5F0E6] mb-4">Brewer Unlock</h3>
                <form onSubmit={handleLogin} className="space-y-4">
                  <input type="password" value={pinInput} onChange={e => setPinInput(e.target.value)} placeholder="Enter PIN (1975)" className="w-full bg-[#12100E] border border-[#2C2520] rounded-lg p-3 text-center tracking-[0.5em] text-[#F5F0E6] outline-none" />
                  <button type="submit" className="w-full bg-[#2C2520] hover:bg-[#3C332A] text-[#F5F0E6] font-bold rounded-lg py-3">Unlock</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
